version: '3.8'

services:
  collage-generator:
    build: .
    container_name: photo_collage_generator
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      # Optional on-disk image byte cache. Match cache.image_dir in config.yaml.
      - ./cache:/app/cache
    restart: unless-stopped
